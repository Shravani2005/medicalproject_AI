<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MediClear - Account Recovery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --teal: #0d9488; --bg: #f8fafc; --red: #ef4444; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        .logo { font-size: 24px; font-weight: bold; color: var(--teal); margin-bottom: 20px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        /* Message Styling */
        .alert { padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; font-weight: 500; }
        .alert-error { background: #fee2e2; color: var(--red); border: 1px solid #fecaca; }
        .alert-success { background: #f0fdfa; color: var(--teal); border: 1px solid #ccfbf1; }

        label { display: block; font-size: 12px; font-weight: 600; color: #64748b; margin-top: 10px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #e2e8f0; border-radius: 10px; box-sizing: border-box; background: #f9fafb; font-size: 14px; }
        .btn { background: var(--teal); color: white; border: none; padding: 14px; width: 100%; border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        .btn:hover { background: #0b7a6f; }
        .back { display: block; text-align: center; margin-top: 20px; color: #64748b; text-decoration: none; font-size: 14px; }
        .info-box { background: #eff6ff; color: #1d4ed8; padding: 10px; border-radius: 8px; font-size: 12px; margin-bottom: 15px; border: 1px solid #dbeafe; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo"><i class="fa-solid fa-heart-pulse"></i> MediClear.</div>
        <h3 style="text-align:center; margin-top:0;">Account Recovery</h3>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    <i class="fa-solid {% if message.tags == 'error' %}fa-circle-xmark{% else %}fa-circle-check{% endif %}"></i>
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <div class="info-box">
            <i class="fa-solid fa-circle-info"></i> <b>Demo Mode:</b> Use PIN <b>1234</b> to reset password.
        </div>

        <form method="POST">
            {% csrf_token %}
            <label>USERNAME</label>
            <input type="text" name="email" placeholder="Enter your username" required>
            
            <label>SECURITY PIN</label>
            <input type="text" name="pin" placeholder="1234" required>
            
            <label>NEW PASSWORD</label>
            <input type="password" name="new_password" placeholder="••••••••" required>
            
            <button type="submit" class="btn">Update Password</button>
        </form>
        
        <a href="{% url 'login' %}" class="back"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
    </div>
</body>
</html>
